spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:docread}
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  ai:
    openai:
      api-key: test-key-not-used
    vectorstore:
      pgvector:
        initialize-schema: false

jwt:
  secret: test-only-jwt-signing-key-that-is-long-enough-for-hmac-sha256
  expiration: 3600000

app:
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
