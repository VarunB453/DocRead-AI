spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:docread}}
    username: ${DB_USER:?DB_USER must be set}
    password: ${DB_PASSWORD:?DB_PASSWORD must be set}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
        temperature: 0.2
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: vector_store
        schema-name: public
        initialize-schema: false
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

app:
  rag:
    chunk-size: 700
    top-k: 5
    similarity-threshold: 0.0
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET must be set}
  expiration: ${JWT_EXPIRATION_MS:3600000}

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
